name: Setup Theos
description: Install Theos and the iOS SDK, and output the ThreadsPulse version

inputs:
  sdk-version:
    description: iOS SDK version to build with (from theos/sdks)
    default: '16.5'

outputs:
  version:
    description: ThreadsPulse version (from TPVersion.h)
    value: ${{ steps.ver.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: brew install ldid make dpkg xz

    - name: Install Theos
      shell: bash
      run: |
        git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
        echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

    - name: Cache iOS SDK
      id: sdk-cache
      uses: actions/cache@v4
      with:
        path: ~/theos-sdk
        key: theos-sdk-${{ inputs.sdk-version }}

    - name: Download iOS SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: |
        git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
        cd /tmp/sdks
        git sparse-checkout set "iPhoneOS${SDK_VERSION}.sdk"
        mkdir -p "$HOME/theos-sdk"
        mv "iPhoneOS${SDK_VERSION}.sdk" "$HOME/theos-sdk/"

    - name: Install SDK
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: cp -R "$HOME/theos-sdk/iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"

    - name: Read version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE 'TP_VERSION @"[^"]+"' TPVersion.h | grep -oE '[0-9][0-9.]*')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "ThreadsPulse version: $VERSION"
