name: Setup Theos
description: Install Theos and the iOS SDK, and output the ThreadsPulse version

inputs:
  sdk-version:
    description: iOS SDK version to build with (from theos/sdks)
    default: '16.5'

outputs:
  version:
    description: ThreadsPulse version (from TPVersion.h)
    value: ${{ steps.ver.outputs.version }}

runs:
  using: composite
  steps:
    # Linux runners start almost immediately (macOS runners often queue for minutes) and build
    # the same binaries with Theos' Linux toolchain.
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential fakeroot rsync zip unzip xz-utils libtinfo6 libplist-utils > /dev/null
        sudo ln -sf "$(command -v make)" /usr/local/bin/gmake

    - name: Install Theos
      shell: bash
      run: |
        git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
        echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

    - name: Cache iOS toolchain
      id: tc-cache
      uses: actions/cache@v4
      with:
        path: ~/theos-toolchain
        key: theos-toolchain-linux-x86_64-v1

    - name: Download iOS toolchain
      if: steps.tc-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/theos-toolchain"
        curl -fsSL --retry 3 https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
          | tar -xJ -C "$HOME/theos-toolchain"

    - name: Install iOS toolchain
      shell: bash
      run: |
        mkdir -p "$THEOS/toolchain"
        cp -R "$HOME/theos-toolchain/." "$THEOS/toolchain/"
        "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1

    - name: Cache iOS SDK
      id: sdk-cache
      uses: actions/cache@v4
      with:
        path: ~/theos-sdk
        key: theos-sdk-${{ inputs.sdk-version }}

    - name: Download iOS SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: |
        git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
        cd /tmp/sdks
        git sparse-checkout set "iPhoneOS${SDK_VERSION}.sdk"
        mkdir -p "$HOME/theos-sdk"
        mv "iPhoneOS${SDK_VERSION}.sdk" "$HOME/theos-sdk/"

    - name: Install SDK
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: cp -R "$HOME/theos-sdk/iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"

    - name: Read version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE 'TP_VERSION @"[^"]+"' TPVersion.h | grep -oE '[0-9][0-9.]*')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "ThreadsPulse version: $VERSION"
